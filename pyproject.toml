[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scratch-next"
version = "3.0.0"
description = "Enterprise-Grade Scratch API, Real-time Cloud Engine & AST Toolkit (100+ Real Features)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Scratch-Next Contributors"}]
keywords = ["scratch", "scratch-api", "cloud-variables", "scratchattach", "async", "game-server", "ast"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
full = ["requests>=2.31.0", "aiohttp>=3.9.0", "websockets>=12.0"]

[project.scripts]
scratch-next = "scratch_next.cli:main"
